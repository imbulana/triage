
llm:
  # Local Ollama OpenAI-compatible endpoint. These model names match `ollama list`.
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  extraction_model: "gemma4:e2b"
  commonkg_model: "gemma4:e2b"
  chat_model: "gemma4:e2b"
  evaluation_model: "deepseek-v3-250324"
  embedding_base_url: "http://localhost:11434/v1"
  embedding_api_key: "ollama"
  embedding_model: "embeddinggemma"

openai:
  # Backward-compatible aliases used by older modules.
  chat_model: "gemma4:e2b"
  embedding_model: "embeddinggemma"
  base_url: "http://localhost:11434/v1"

# Model Parameters
model_params:
  openai_embedding_dim: 768
  max_token_size: 8192
